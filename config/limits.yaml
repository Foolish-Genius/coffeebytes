# Cost and time caps. Deterministic paths run first; paid calls are optional fallbacks only.
llm:
  enabled: auto            # auto = only if ANTHROPIC_API_KEY (or ant profile) is present; false = never
  model: claude-opus-5-5   # change to a cheaper model here if you prefer
  effort: low
  max_tokens: 1024
  max_calls_per_job: 6
  max_page_chars: 6000     # hard cap on page text sent to the model
  inr_per_mtok_in: 340     # ~USD 4 / MTok at ~85 INR/USD
  inr_per_mtok_out: 1700   # ~USD 20 / MTok
max_inr_per_job: 50
crustdata:                 # company context only (identity, HQ, headcount, trader signal) - never approval evidence
  enabled: auto            # auto = only if CRUSTDATA_API_KEY is set (in .env); false = never
  allow_spend: false       # HARD LOCK: false = no network call, dry-run plan + credit estimate only.
                           # Override for one run with: run ... --crustdata-spend  (or `context <job> --spend`)
  mode: identify           # identify = 0.2 credits per MATCH, misses free (name, domain, size range)
                           # enrich   = 2 credits per record (adds HQ, country, exact headcount)
  fields: [basic_info, locations, headcount]   # enrich mode only
  max_credits_per_job: 5   # worst-case cap; identifiers beyond it are never sent (identify: 25 companies)
  reserve_credits: 50      # free balance check must show estimate + this before any spend
  cache_days: 30           # repeat lookups of the same company are free
  inr_per_credit: 0        # set to your plan's rate to see INR in the ledger
  trader_headcount_max: 20
  timeout_s: 20
fetch:
  timeout_s: 15
  max_pages_per_candidate: 2
  user_agent: "SiliconScout/3.0 (sourcing research bot)"
discovery:
  min_candidates: 8
  max_candidates: 12
distributor:
  max_quote_age_minutes: 60
mode: demo                 # demo allows fixtures; live rejects TEST_FIXTURE data in decisions
